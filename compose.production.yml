services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kapeldiner_service_db}
      POSTGRES_USER: ${POSTGRES_USER:-kapeldiner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/KapeldinerService/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__KapeldinerServiceDb: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-kapeldiner_service_db};Username=${POSTGRES_USER:-kapeldiner};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      PublicBaseUrl: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL to the HTTPS site origin}
      Auth__Bootstrap__Admin__Login: ${ADMIN_LOGIN:-}
      Auth__Bootstrap__Admin__Password: ${ADMIN_PASSWORD:-}
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-}
      Email__Smtp__FromName: ${SMTP_FROM_NAME:-Капельдинер}
      Email__Smtp__UserName: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
    volumes:
      - data-protection-keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  postgres-data:
  data-protection-keys:
